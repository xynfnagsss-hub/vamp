name: Build Windows Installer

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install deps
        run: npm ci

      - name: Build client
        run: npm run build:client

      - name: Build Windows installer
        run: npx electron-builder --win --x64 --ia32=false

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: vamp-windows-installer
          path: |
            dist/*.exe
            dist/*.nsis*
